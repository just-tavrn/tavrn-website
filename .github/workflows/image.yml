# SPDX-License-Identifier: Apache-2.0
#
# The website's container image (deploy/Dockerfile) through the organization's reusable workflow: built on relevant
# pushes to main and on v* tags and pushed to ghcr.io/just-tavrn/tavrn-website. A release of tavrn-web or tavrn-node needs
# no new image: the download page reads the releases at runtime through the container's /gh/releases/* proxies.
# The image is generic: no build arguments (their defaults are the official site's), and the imprint and contact
# details are runtime variables of the container (README.md, "Configuration"). Gated by CI_ENABLED.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: What changed
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  image:
    name: Container image
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' && needs.changes.outputs.build == 'true' }}
    uses: just-tavrn/.github/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      dockerfile: deploy/Dockerfile
      image-name: tavrn-website
      # The docs are synced from sources/ (private submodules until the project is public).
      submodules: "true"
      push: true
    secrets:
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
