# SPDX-License-Identifier: Apache-2.0
#
# Uses the organization's reusable workflows (just-tavrn/.github). Every job is gated by the repository
# variable CI_ENABLED: nothing runs until the owner sets it to "true".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  js:
    name: JavaScript
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/js-ci.yml@main
    with:
      skip: ${{ needs.changes.outputs.build != 'true' }}
      # SPDX headers and dependency licenses (the reusable workflow's defaults), the docs sync without any warning
      # (--strict: no link to a vanished anchor, no configured section or replacement that no longer matches), astro
      # check, then the build before the tests, because tests/dist.test.ts checks the built site (JavaScript budget,
      # CSP hashes, no foreign URLs). The build is the run's only one: the e2e job below tests this dist/.
      typecheck: node scripts/sync-docs.mjs --strict && pnpm typecheck
      test: pnpm build && pnpm test
      build: test -f dist/index.html && test -s csp-script-hashes.txt
      artifact-name: website-dist
      artifact-path: dist
      # The docs are synced from the source repositories under sources/ (git submodules, private for now).
      submodules: "true"
    secrets:
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  e2e:
    name: End-to-end (Chromium, Android emulation)
    # Against the dist/ of the JavaScript job (no second build: sharp encoded every screenshot again).
    needs: [changes, js]
    if: ${{ vars.CI_ENABLED == 'true' && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read access to the private source repositories (submodules)
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git submodule update --init
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: dist
      - run: test -f dist/index.html
      # csp-script-hashes.txt lives next to dist/, not in the artifact: the specs' production CSP (e2e/helpers.ts)
      # reads it. Recomputed from the downloaded dist/ (deterministic: the same hashes the js job wrote).
      - name: CSP hashes of this dist/
        run: node scripts/csp-hashes.mjs && test -s csp-script-hashes.txt
      - run: pnpm exec playwright test -c e2e/playwright.config.ts --project chromium --project mobile-android --workers=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  caddyfile:
    name: Caddyfile
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: caddy validate
        # The Caddy image of deploy/Dockerfile, by digest (Dependabot bumps the Dockerfile; keep the two equal).
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  publish-check:
    name: Publication hygiene
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private files, domains or secrets
        env:
          # Comma-separated private domains, hosts and addresses (repository or organization secret).
          PUBLISH_CHECK_PRIVATE: ${{ secrets.PUBLISH_CHECK_PRIVATE }}
          # Dependabot's pull requests see only Dependabot secrets; the push to main runs the full check.
          PUBLISH_CHECK_ALLOW_UNCONFIGURED: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && '1' || '' }}
        run: scripts/publish-check.sh

  shared-scripts:
    # The copies of the organization's shared scripts (SPDX check, publication check, labels, JS licenses) are the
    # source in just-tavrn/.github apart from their SPDX line (its docs/GITHUB.md "Shared scripts").
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/shared-scripts.yml@main

  change-filter:
    name: Change filter and SPDX
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci-changes.test.sh
      - run: bash scripts/check-spdx.sh
