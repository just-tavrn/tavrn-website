version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # Playwright stays on the version whose Chromium the other repositories' runners have cached.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor"]
      # Majors that need their own migration (2026-10-16): TypeScript 7 (astro check and the stricter checker),
      # Preact 11 (stricter JSX attribute types), @types/node follows the Node LTS the runner image uses.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    ignore:
      # The Node image stays on the LTS line (Node 25 is a current, not an LTS release).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # The documentation sources (sources/*): a daily bump pulls the latest docs of the code repositories into the site,
  # so a docs-only change there builds here and nowhere else (just-tavrn/.github, docs/GITHUB.md "Docs-only changes").
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: daily }
    groups:
      sources:
        patterns: ["*"]
