version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # Playwright stays on the version whose Chromium the other repositories' runners have cached.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
  # The documentation sources (sources/*): a daily bump pulls the latest docs of the code repositories into the site,
  # so a docs-only change there builds here and nowhere else (just-tavrn/.github, docs/GITHUB.md "Docs-only changes").
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: daily }
    groups:
      sources:
        patterns: ["*"]
